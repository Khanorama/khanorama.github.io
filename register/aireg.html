<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCML Application | LeapCode</title>
    <link rel="icon" href="../images/favicon2.png" type="image/png" />
    <link rel="stylesheet" href="../style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <div class="header-logo">
        <h1>
          <a href="../index.html" class="home-link">
            <span class="star">LEAP</span><span class="code">CODE</span>
          </a>
        </h1>
      </div>
      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="../about.html">About</a>
        <a href="../courses.html" class="active">Courses</a>
        <a href="../library.html">Library</a>
        <a href="../support.html">Support</a>
      </nav>
      <div class="header-controls">
        <label class="switch">
          <input type="checkbox" id="theme-checkbox" />
          <span class="slider"></span>
        </label>
        <button
          class="mobile-nav-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
        >
          <span class="hamburger"></span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero-section form-hero">
        <div class="hero-content">
          <h1>LCML: Machine Learning with Python</h1>
          <p class="tagline">Selective Program Application</p>
        </div>
      </section>

      <section class="form-section">
        <div class="form-container">
          <form
            method="post"
            id="lcmlApplicationForm"
            action="https://script.google.com/macros/s/AKfycbyKrTYQ-bqV7QZWucvW_wlX0YdgzLXIUuGkN-XZ2wjKDjr_hOlfsPRhLxrTCI2e63hM/exec"
          >
            <p class="form-note">
              <span class="text-required">*</span> Indicates required fields.
            </p>

            <div class="form-group">
              <label for="studentFullName"
                >Student Full Name <span class="text-required">*</span></label
              >
              <input
                type="text"
                id="studentFullName"
                name="studentFullName"
                required
              />
            </div>

            <div class="form-group">
              <label for="studentEmail"
                >Student Email <span class="text-required">*</span></label
              >
              <input
                type="email"
                id="studentEmail"
                name="studentEmail"
                required
              />
            </div>

            <div class="form-group">
              <label for="studentPhoneNumber">Student Phone Number</label>
              <input
                type="tel"
                id="studentPhoneNumber"
                name="studentPhoneNumber"
              />
            </div>

            <div class="form-group">
              <label for="studentGrade"
                >Student Grade (6–12)
                <span class="text-required">*</span></label
              >
              <input
                type="number"
                id="studentGrade"
                name="studentGrade"
                min="6"
                max="12"
                required
                placeholder="6–12"
              />
            </div>

            <div class="form-group">
              <label for="studentSchool">Student School</label>
              <input type="text" id="studentSchool" name="studentSchool" />
            </div>

            <hr class="form-divider" />

            <div class="form-group">
              <label for="parentName"
                >Parent Name <span class="text-required">*</span></label
              >
              <input type="text" id="parentName" name="parentName" required />
            </div>

            <div class="form-group">
              <label for="parentEmail"
                >Parent Email <span class="text-required">*</span></label
              >
              <input
                type="email"
                id="parentEmail"
                name="parentEmail"
                required
              />
            </div>

            <div class="form-group">
              <label for="parentPhoneNumber"
                >Parent Phone Number <span class="text-required">*</span></label
              >
              <input
                type="tel"
                id="parentPhoneNumber"
                name="parentPhoneNumber"
                required
              />
            </div>

            <hr class="form-divider" />

            <div class="form-group">
              <label for="takenPython1"
                >Have you taken Python 1 previously?
                <span class="text-required">*</span></label
              >
              <select id="takenPython1" name="takenPython1" required>
                <option value="">Select one</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="pythonExperience">
                Do you have experience programming in Python? If so, describe:
                <span class="text-required">*</span>
              </label>
              <textarea
                id="pythonExperience"
                name="pythonExperience"
                class="word-limited"
                rows="5"
                maxlength="1800"
                required
              ></textarea>
              <small class="word-counter">0 / 300 words</small>
            </div>

            <hr class="form-divider" />

            <div class="form-group">
              <label for="transcript">
                Upload Middle School or High School Report Card / Transcript
                <span class="text-required">*</span>
              </label>
              <input
                type="file"
                id="transcript"
                name="transcript"
                accept=".pdf,.jpg,.jpeg,.png"
                required
              />
              <small id="file-size-warning"
                >PDF or image files only (Max 5MB)</small
              >
            </div>

            <hr class="form-divider" />

            <div class="form-group">
              <label for="problemSolvingEssay">
                Describe a challenging problem you’ve tried to solve
                independently. What did you learn?
                <span class="text-required">*</span>
              </label>
              <textarea
                id="problemSolvingEssay"
                name="problemSolvingEssay"
                class="word-limited"
                rows="6"
                maxlength="1800"
                required
              ></textarea>
              <small class="word-counter">0 / 300 words</small>
            </div>

            <div class="form-group">
              <label for="lcmlGoalsEssay">
                How will the LCML program help you achieve your goals?
                <span class="text-required">*</span>
              </label>
              <textarea
                id="lcmlGoalsEssay"
                name="lcmlGoalsEssay"
                class="word-limited"
                rows="6"
                maxlength="1800"
                required
              ></textarea>
              <small class="word-counter">0 / 300 words</small>
            </div>

            <div class="form-button-container">
              <button type="submit" class="form-button" id="submitButton">
                Submit Application
              </button>
            </div>
            <div
              id="submissionStatus"
              class="form-submission-status"
              style="text-align: center; margin-top: 10px"
            ></div>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        <span id="currentYear"></span> LeapCode |
        <a href="mailto:support@leapcode.org">support@leapcode.org</a>
      </p>
    </footer>

    <script>
      // --- 1. THEME TOGGLE ---
      const themeCheckbox = document.getElementById("theme-checkbox");
      const bodyEl = document.body;

      function applyTheme(theme) {
        if (theme === "dark") {
          bodyEl.classList.add("dark-mode");
          if (themeCheckbox) themeCheckbox.checked = true;
        } else {
          bodyEl.classList.remove("dark-mode");
          if (themeCheckbox) themeCheckbox.checked = false;
        }
      }

      const savedTheme = localStorage.getItem("theme") || "dark";
      applyTheme(savedTheme);

      if (themeCheckbox) {
        themeCheckbox.addEventListener("change", () => {
          const newTheme = themeCheckbox.checked ? "dark" : "light";
          localStorage.setItem("theme", newTheme);
          applyTheme(newTheme);
        });
      }

      // --- 2. MOBILE NAV ---
      const mobileNavToggle = document.querySelector(".mobile-nav-toggle");
      const mainNav = document.querySelector(".main-nav");
      if (mobileNavToggle && mainNav) {
        mobileNavToggle.addEventListener("click", () => {
          const isExpanded = mainNav.classList.toggle("active");
          mobileNavToggle.setAttribute("aria-expanded", isExpanded);
        });
      }

      // --- 3. WORD COUNTER ---
      document.querySelectorAll(".word-limited").forEach((textarea) => {
        const counter = textarea.nextElementSibling;
        textarea.addEventListener("input", () => {
          const words = textarea.value.trim().split(/\s+/).filter(Boolean);
          if (words.length > 300) {
            textarea.value = words.slice(0, 300).join(" ");
          }
          counter.textContent = `${Math.min(words.length, 300)} / 300 words`;
        });
      });

      // --- 4. FORM SUBMISSION WITH FILE UPLOAD ---
      const form = document.getElementById("lcmlApplicationForm");
      const submitButton = document.getElementById("submitButton");
      const statusDiv = document.getElementById("submissionStatus");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const fileInput = document.getElementById("transcript");
        const file = fileInput.files[0];

        // File size limit: 5MB
        const MAX_SIZE = 5 * 1024 * 1024;
        if (file && file.size > MAX_SIZE) {
          alert("File is too large. Please upload a file smaller than 5MB.");
          return;
        }

        // Visual UI update
        submitButton.disabled = true;
        submitButton.textContent = "Uploading & Submitting...";
        statusDiv.textContent = "Processing... Please do not refresh.";

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        if (file) {
          const reader = new FileReader();
          reader.onload = function (event) {
            data.fileData = event.target.result; // Base64 string
            data.fileName = file.name;
            data.fileMimeType = file.type;
            sendToAppsScript(data);
          };
          reader.readAsDataURL(file);
        } else {
          sendToAppsScript(data);
        }
      });

      function sendToAppsScript(data) {
        const searchParams = new URLSearchParams();
        for (const key in data) {
          searchParams.append(key, data[key]);
        }

        fetch(form.action, {
          method: "POST",
          body: searchParams,
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
        })
          .then((response) => response.json())
          .then((res) => {
            if (res.result === "success") {
              window.location.href = "registrationcomplete.html";
            } else {
              throw new Error(res.error || "Unknown error occurred.");
            }
          })
          .catch((err) => {
            console.error(err);
            statusDiv.textContent = "Submission failed. Please try again.";
            submitButton.disabled = false;
            submitButton.textContent = "Submit Application";
          });
      }

      // --- 5. FOOTER ---
      document.getElementById("currentYear").textContent =
        new Date().getFullYear();
    </script>
  </body>
</html>
