<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Registration | LeapCode</title>
    <link rel="icon" href="../images/favicon2.png" type="image/png" />
    <link rel="stylesheet" href="../style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <div class="header-logo">
        <h1>
          <a href="../index.html" class="home-link">
            <span class="star">LEAP</span><span class="code">CODE</span>
          </a>
        </h1>
      </div>
      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="../about.html">About</a>
        <a href="../courses.html" class="active">Courses</a>
        <a href="../library.html">Library</a>
        <a href="../support.html">Support</a>
      </nav>
      <div class="header-controls">
        <label class="switch">
          <input type="checkbox" id="theme-checkbox" />
          <span class="slider"></span>
        </label>
        <button
          class="mobile-nav-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
        >
          <span class="hamburger"></span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero-section form-hero">
        <div class="hero-content">
          <h1>PYTHON I Course Registration</h1>
          <p class="tagline">Please complete all required fields to apply.</p>
        </div>
      </section>

      <section class="form-section">
        <div class="form-container">
          <form
            method="post"
            action="https://script.google.com/macros/s/AKfycbwD2kwVaTSZDoY12sB10hLPtnXhZAnLiQQQF3c8Pmd5qILloc2E79u8JLOdSbfrUVQ8/exec"
            name="registrationForm"
            id="registrationForm"
          >
            <p class="form-note">
              <span class="text-required">*</span> Indicates required fields.
            </p>

            <!-- STUDENT INFO -->
            <div class="form-group">
              <label for="studentFullName"
                >Student Full Name <span class="text-required">*</span></label
              >
              <input
                type="text"
                id="studentFullName"
                name="studentFullName"
                required
              />
            </div>

            <div class="form-group">
              <label for="studentEmail"
                >Student Email <span class="text-required">*</span></label
              >
              <input
                type="email"
                id="studentEmail"
                name="studentEmail"
                required
              />
            </div>

            <div class="form-group">
              <label for="studentPhoneNumber">Student Phone Number</label>
              <input
                type="tel"
                id="studentPhoneNumber"
                name="studentPhoneNumber"
              />
            </div>

            <div class="form-group">
              <label for="studentGrade">Student Grade (6–12)</label>
              <input
                type="number"
                id="studentGrade"
                name="studentGrade"
                min="6"
                max="12"
                placeholder="6–12"
              />
            </div>

            <div class="form-group">
              <label for="studentSchool">Student School</label>
              <input type="text" id="studentSchool" name="studentSchool" />
            </div>

            <hr class="form-divider" />

            <!-- PARENT INFO -->
            <div class="form-group">
              <label for="parentName"
                >Parent Name <span class="text-required">*</span></label
              >
              <input type="text" id="parentName" name="parentName" required />
            </div>

            <div class="form-group">
              <label for="parentEmail"
                >Parent Email <span class="text-required">*</span></label
              >
              <input
                type="email"
                id="parentEmail"
                name="parentEmail"
                required
              />
            </div>

            <div class="form-group">
              <label for="parentPhoneNumber"
                >Parent Phone Number <span class="text-required">*</span></label
              >
              <input
                type="tel"
                id="parentPhoneNumber"
                name="parentPhoneNumber"
                required
              />
            </div>

            <hr class="form-divider" />

            <!-- ESSAY -->
            <div class="form-group">
              <label for="pythonInterest">
                Why do you want to participate in Python 1?
                <span class="text-required">*</span>
              </label>
              <textarea
                id="pythonInterest"
                name="pythonInterest"
                rows="6"
                maxlength="1800"
                required
                placeholder="300 words max"
              ></textarea>
              <small id="wordCount">0 / 300 words</small>
            </div>

            <div class="form-button-container">
              <button type="submit" class="form-button" id="submitButton">
                Submit Registration
              </button>
            </div>

            <div id="submissionStatus" class="form-submission-status"></div>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        <span id="currentYear"></span> LeapCode |
        <a href="mailto:support@leapcode.org">support@leapcode.org</a>
      </p>
    </footer>

    <script>
      // --- Theme Toggle ---
      const themeCheckbox = document.getElementById("theme-checkbox");
      const bodyEl = document.body;

      function applyTheme(theme) {
        if (theme === "dark") {
          bodyEl.classList.add("dark-mode");
          if (themeCheckbox) themeCheckbox.checked = true;
        } else {
          bodyEl.classList.remove("dark-mode");
          if (themeCheckbox) themeCheckbox.checked = false;
        }
      }

      const savedTheme = localStorage.getItem("theme");
      let initialTheme = savedTheme ? savedTheme : "dark";
      applyTheme(initialTheme);

      if (themeCheckbox) {
        themeCheckbox.addEventListener("change", () => {
          const newTheme = themeCheckbox.checked ? "dark" : "light";
          localStorage.setItem("theme", newTheme);
          applyTheme(newTheme);
        });
      }

      // --- Mobile Nav Toggle ---
      const mobileNavToggle = document.querySelector(".mobile-nav-toggle");
      const mainNav = document.querySelector(".main-nav");

      if (mobileNavToggle && mainNav) {
        mobileNavToggle.addEventListener("click", () => {
          const isExpanded = mainNav.classList.toggle("active");
          mobileNavToggle.setAttribute("aria-expanded", isExpanded);
        });
      }
    </script>

    <script>
      // WORD COUNT (300 MAX)
      const textarea = document.getElementById("pythonInterest");
      const wordCount = document.getElementById("wordCount");

      if (textarea) {
        textarea.addEventListener("input", () => {
          const words = textarea.value.trim().split(/\s+/).filter(Boolean);
          if (words.length > 300) {
            textarea.value = words.slice(0, 300).join(" ");
          }
          wordCount.textContent = `${Math.min(words.length, 300)} / 300 words`;
        });
      }

      // FORM VALIDATION
      const form = document.getElementById("registrationForm");
      const submitButton = document.getElementById("submitButton");
      const submissionStatusDiv = document.getElementById("submissionStatus");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const requiredIds = [
          "studentFullName",
          "studentEmail",
          "parentName",
          "parentEmail",
          "parentPhoneNumber",
          "pythonInterest",
        ];

        for (let id of requiredIds) {
          const el = document.getElementById(id);
          if (!el.value.trim()) {
            alert("Please complete all required fields.");
            el.focus();
            return;
          }
        }

        submitButton.disabled = true;
        submitButton.textContent = "Submitting...";
        submissionStatusDiv.textContent = "Please do not refresh the page.";

        fetch(form.action, {
          method: "POST",
          body: new FormData(form),
        })
          .then(() => {
            window.location.href = "registrationcomplete.html";
          })
          .catch(() => {
            submissionStatusDiv.textContent =
              "Submission failed. Please try again.";
            submitButton.disabled = false;
            submitButton.textContent = "Submit Registration";
          });
      });

      // FOOTER YEAR
      document.getElementById("currentYear").textContent =
        new Date().getFullYear();
    </script>
  </body>
</html>
