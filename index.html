<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeapCode</title>
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="LeapCode is under renovation. The site will be back soon."
    />
    <link rel="icon" href="images/favicon2.png" type="image/png" />
    <meta name="theme-color" content="#07192b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --navy: #07192b;
        --text: #eaf0f6;
        --muted: #93a6b9;
        --blue: #2f8fff;
        --green: #00ff7f;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--navy);
        color: var(--text);
        font-family: "Roboto", sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      /* Brand ribbon: a hard split of the two wordmark colors */
      .ribbon {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--blue) 0 50%,
          var(--green) 50% 100%
        );
        z-index: 5;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 56px 24px 32px;
      }

      .content {
        width: 100%;
        max-width: 540px;
        animation: fade 0.6s ease both;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .wordmark {
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.015em;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1;
        white-space: nowrap;
      }
      .wordmark .leap {
        color: var(--blue);
      }
      .wordmark .code {
        color: var(--green);
      }

      .notice {
        border-left: 2px solid var(--green);
        padding-left: 22px;
        margin-top: 34px;
      }
      .eyebrow {
        margin: 0;
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--green);
      }
      .notice h1 {
        margin: 12px 0 14px;
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        color: var(--text);
        font-size: clamp(1.5rem, 4.6vw, 2.15rem);
        line-height: 1.18;
      }
      .notice p {
        margin: 0;
        color: var(--muted);
        font-size: 1.02rem;
        max-width: 42ch;
      }

      .contact {
        margin-top: 30px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .contact a {
        color: var(--blue);
        text-decoration: none;
        border-bottom: 1px solid rgba(47, 143, 255, 0.4);
        padding-bottom: 1px;
      }
      .contact a:hover {
        border-bottom-color: var(--blue);
      }

      footer {
        padding: 22px 24px 28px;
        color: #647a8e;
      }
      .footer-inner {
        max-width: 540px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 0.82rem;
        color: #647a8e;
      }
      .footer-inner .tag {
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      @media (max-width: 420px) {
        .footer-inner {
          justify-content: flex-start;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .content {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="ribbon" aria-hidden="true"></div>

    <main>
      <div class="content">
        <div class="wordmark">
          <span class="leap">LEAP</span><span class="code">CODE</span>
        </div>

        <div class="notice">
          <p class="eyebrow">Under renovation</p>
          <h1>We&rsquo;re rebuilding LeapCode.</h1>
          <p>
            The site is offline for a short while as we make improvements.
            Thanks for your patience. We will be back soon.
          </p>
        </div>

        <p class="contact">
          Questions? Reach us at
          <a href="mailto:support@leapcode.org">support@leapcode.org</a>.
        </p>
      </div>
    </main>

    <footer>
      <div class="footer-inner">
        <span class="tag">Code. Compete. Connect.</span>
        <span><span id="year"></span> LeapCode</span>
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
